name: Example full run
run-name: "TabPFN CPU benchmark on ${{ github.ref_name }}"

# Temporary: benchmarks TabPFN commits around #1312 on standard runners. Each job
# runs every ref on one runner, so the comparison shares that runner's hardware.

on:
  schedule:
    - cron: "0 3 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: TabPFN CPU benchmark (${{ matrix.attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Describe runner
        run: |
          nproc
          lscpu | grep -E "Model name|Thread\(s\) per core|Core\(s\) per socket|L3 cache"
          grep -qw avx512f /proc/cpuinfo && echo "avx512f: yes" || echo "avx512f: no"

      - name: Benchmark TabPFN refs
        env:
          TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          bash bisect_tabpfn/bench_commit.sh dbba40314 09b4188e2 v9.1.0 | tee bench.txt
          {
            echo '```'
            lscpu | grep "Model name"
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
