[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tabpfn_time_series"
dynamic = ["version"]
authors = [{ name = "Liam Shi Bin Hoo", email = "hoos@tf.uni-freiburg.de" }]
description = "Zero-shot time series forecasting with TabPFNv2"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Floored so `--resolution lowest-direct` in CI has something to pin to;
    # 4.66 is what the tree already resolves to transitively.
    "tqdm>=4.66",
    "pandas>=2.1.2",
    "gluonts>=0.16.0",
    # 0.3.0 is the oldest client the cloud API still accepts: older ones get a
    # 426 Upgrade Required from `try_connection` before any prediction runs.
    "tabpfn-client>=0.3.0",
    "tabpfn>=8.0.0",
    "statsmodels>=0.14.5",
    "datasets>=2.15",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.1",
    "backoff>=2.2.1",
    "tabpfn-common-utils[telemetry-interactive]>=0.2.2",
    "fev>=0.6.1",
]

[project.optional-dependencies]
benchmarking = [
    "autogluon.timeseries>=1.5.0, <2.0"
]
explainability = [
    "shapiq>=1.4",
    "matplotlib>=3.10.3",
]


[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
exclude = ["docs", "gift_eval"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", "gift_eval"]

[dependency-groups]
# The minimum subset of the dev dependencies required to run the tests in CI.
# The idea is to stay as close to a user's deployment environment as possible,
# so a passing test run means the published package works — not that our local
# tooling happens to paper over a gap.
ci = [
    "pytest>=8.4.1",
]
dev = [
    {include-group = "ci"},
    "tabpfn-time-series[benchmarking,explainability]",
    "jupyter",
    "wandb>=0.19.8",
    "submitit>=1.5.2",
    "ruff~=0.12.0",
    "pre-commit",
    "twine",
    "build",
    "hatch",
    "hatch-vcs",
    "ipykernel>=6.29.5",
]

[project.urls]
"Homepage" = "https://github.com/PriorLabs/tabpfn-time-series"
"Bug Tracker" = "https://github.com/PriorLabs/tabpfn-time-series/issues"

[tool.pytest.ini_options]
markers = [
    "uses_tabpfn_client: These tests require a TabPFN API key.",
    "uses_tabpfn_local: These tests require a local TabPFN model.",
]
