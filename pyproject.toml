[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabpfn_time_series"
# Bumped by .github/workflows/release-create-pr.yml; the release tag is
# verified against this value before anything is published.
version = "1.2.0"
authors = [{ name = "Liam Shi Bin Hoo", email = "hoos@tf.uni-freiburg.de" }]
description = "Zero-shot time series forecasting with TabPFNv2"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Floored so `--resolution lowest-direct` in CI has something to pin to;
    # 4.66 is what the tree already resolves to transitively.
    "tqdm>=4.66",
    "pandas>=2.1.2",
    "gluonts>=0.16.0",
    # 0.3.0 is the oldest client the cloud API still accepts: older ones get a
    # 426 Upgrade Required from `try_connection` before any prediction runs.
    "tabpfn-client>=0.3.0",
    # 8.0.0 cannot resolve the TS checkpoint that `defaults.py` selects in LOCAL
    # mode: its list of downloadable regressor checkpoints holds only
    # `tabpfn-v3-regressor-v3_default.ckpt`, so every LOCAL-mode call raises
    # ValueError. 8.0.1 is the first release that lists it.
    "tabpfn>=8.0.1",
    "statsmodels>=0.14.5",
    # 2.21 is the first release that works under numpy 2 (earlier versions call
    # `np.array(..., copy=False)`, which numpy 2 rejects outright). numpy is not
    # a direct dependency here, so it always resolves to 2.x and the old floor
    # produced an unusable combination.
    "datasets>=2.21",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.1",
    "backoff>=2.2.1",
    "tabpfn-common-utils[telemetry-interactive]>=0.2.2",
    "fev>=0.6.1",
]

[project.optional-dependencies]
benchmarking = [
    "autogluon.timeseries>=1.5.0, <2.0"
]
explainability = [
    "shapiq>=1.4",
    "matplotlib>=3.10.3",
]


[tool.hatch.build.targets.wheel]
exclude = ["docs", "gift_eval"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", "gift_eval"]

[dependency-groups]
# The minimum subset of the dev dependencies required to run the tests in CI.
# The idea is to stay as close to a user's deployment environment as possible,
# so a passing test run means the published package works — not that our local
# tooling happens to paper over a gap.
ci = [
    "pytest>=8.4.1",
    # -n auto for the example smoke run.
    "pytest-xdist>=3.6.0",
]
dev = [
    {include-group = "ci"},
    "tabpfn-time-series[benchmarking,explainability]",
    "jupyter",
    "wandb>=0.19.8",
    "submitit>=1.5.2",
    "ruff~=0.12.0",
    "pre-commit",
    "twine",
    "build",
    "hatch",
    "towncrier>=24.8.0",
    "ipykernel>=6.29.5",
]

[project.urls]
"Homepage" = "https://github.com/PriorLabs/tabpfn-time-series"
"Bug Tracker" = "https://github.com/PriorLabs/tabpfn-time-series/issues"

[tool.pytest.ini_options]
markers = [
    "uses_tabpfn_client: These tests require a TabPFN API key.",
    "uses_tabpfn_local: These tests require a local TabPFN model.",
]

[tool.changelog-bot.towncrier_changelog]
enabled = true
changelog_skip_label = "no changelog needed"

[tool.towncrier]
directory = "changelog"
filename = "CHANGELOG.md"
start_string = "## [Unreleased]\n"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/PriorLabs/tabpfn-time-series/pull/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.section]]
path = ""
name = ""
